<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Leitura NFC</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: #111;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .box {
      width: 100%;
      max-width: 500px;
      text-align: center;
    }

    .titulo {
      font-size: 18px;
      opacity: .65;
      margin-bottom: 18px;
    }

    #numero {
      font-size: clamp(56px, 18vw, 110px);
      font-weight: 800;
      line-height: 1;
      word-break: break-word;
      letter-spacing: -2px;
    }

    #status {
      margin-top: 24px;
      font-size: 15px;
      opacity: .5;
    }
  </style>
</head>

<body>
  <div class="box">
    <div class="titulo">NÚMERO LIDO</div>
    <div id="numero">---</div>
    <div id="status"></div>
  </div>

  <script>
    function pegarNumero() {
      const url = new URL(window.location.href);

      // Ex.: index.html?op=12345
      let numero =
        url.searchParams.get("op") ||
        url.searchParams.get("numero") ||
        url.searchParams.get("n") ||
        "";

      // Ex.: index.html#12345
      if (!numero && window.location.hash) {
        numero = decodeURIComponent(window.location.hash.substring(1));
      }

      // Ex.: /12345
      if (!numero) {
        const partes = window.location.pathname
          .split("/")
          .filter(Boolean);

        const ultima = partes[partes.length - 1] || "";

        if (/^\d+$/.test(ultima)) {
          numero = ultima;
        }
      }

      return numero.trim();
    }

    const numero = pegarNumero();
    const numeroEl = document.getElementById("numero");
    const statusEl = document.getElementById("status");

    if (numero) {
      numeroEl.textContent = numero;
      document.title = numero;

      if ("vibrate" in navigator) {
        navigator.vibrate(100);
      }
    } else {
      numeroEl.textContent = "---";
      statusEl.textContent = "Nenhum número recebido pela tag NFC";
    }
  </script>
</body>
</html>
